name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - name: Use the lockfile npm version
        run: npm install --global npm@10.9.8
      - name: Install dependencies
        run: npm ci
      - name: Check whitespace
        run: git diff --check
      - name: Run checks
        run: npm run ci
      - name: Verify audit exception policy
        run: npm run test:audit-policy
      - name: Audit production dependencies (high/critical gate with owned exceptions)
        run: npm run audit
