version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint, its plugins and typescript-eslint share peer ranges, so a bump
      # of one alone often cannot install. Update them together.
      lint-tooling:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
    ignore:
      # typescript-eslint supports TypeScript <6.1 only, so TypeScript 7 cannot
      # install yet. Revisit when typescript-eslint accepts it.
      - dependency-name: typescript
        versions: [">=7"]
